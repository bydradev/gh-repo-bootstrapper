name: Bug Report
description: Report incorrect or broken behaviour in bootstrap.py or a generated repository
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. A few things before you start:

        - **Security issue?** Don't file it here. See [SECURITY.md](https://github.com/bydradev/gh-repo-bootstrapper/blob/main/SECURITY.md).
        - **Have a fix?** Describe the problem here, then open a pull request as described in [CONTRIBUTING.md](https://github.com/bydradev/gh-repo-bootstrapper/blob/main/CONTRIBUTING.md).
        - **Please don't paste full generated files, `.env` contents, tokens, or repo configuration.** File *paths* and *behaviour* are what we need, not the file contents.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: I searched existing issues and this isn't a duplicate
          required: true
        - label: "This is not a security report (see [SECURITY.md](https://github.com/bydradev/gh-repo-bootstrapper/blob/main/SECURITY.md))"
          required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect, and what actually happened instead?
      placeholder: |
        Expected: ...
        Actual: ...
    validations:
      required: true

  - type: dropdown
    id: failure-location
    attributes:
      label: Where did it fail?
      description: |
        A bad bootstrapper-generated API call or configuration payload can legitimately surface as a `gh`/GitHub API error, so "it's just a gh/API failure" isn't a reason to rule this out on its own.
      options:
        - Generated files/templates (wrong content after running)
        - Repository configuration or API call bootstrap.py made
        - Checking or adopting an existing repository (--check / --adopt)
        - Unknown / not sure
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: |
        Include the command you ran. **Redact anything sensitive.** Org names are usually fine, but drop tokens, real repo names you don't want public, and never paste the Release Please App key or client ID.
      placeholder: |
        1. ./bootstrap.py --name my-app --type swift --scheme MyApp --org acme --dry-run
        2. ...
    validations:
      required: true

  - type: dropdown
    id: repo-type
    attributes:
      label: Repository type
      options:
        - nextjs
        - python
        - swift
        - rust
        - simple
        - Not applicable / not generation-related
    validations:
      required: true

  - type: checkboxes
    id: options
    attributes:
      label: Options in play (check any that apply)
      options:
        - label: "--private"
        - label: "--postgres"
        - label: "--scheme"
        - label: "--destination"
        - label: "--xcodegen"
        - label: "--screenshots"
        - label: "--configure-only"
        - label: "--check"
        - label: "--adopt"
        - label: "--replace-generated-sections"
        - label: "--dry-run"
        - label: "--non-interactive"

  - type: input
    id: version
    attributes:
      label: bootstrap.py version or commit
      description: A release tag, or `git rev-parse HEAD` if running from a checkout
      placeholder: v0.10.0 or 65c16aa
    validations:
      required: true

  - type: input
    id: affected-paths
    attributes:
      label: Affected generated file(s)
      description: Paths only (e.g. `release-please-config.json`, `.github/workflows/test-swift.yml`), not their contents
      placeholder: release-please-config.json

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.1
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.13.1"
    validations:
      required: true

  - type: input
    id: gh-version
    attributes:
      label: gh CLI version
      placeholder: gh version 2.97.0
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Error messages, relevant log lines or anything else. Leave out secrets and full file contents.
