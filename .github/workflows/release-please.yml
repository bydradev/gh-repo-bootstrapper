name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# As in the release-please templates: one run at a time, and queue: max keeps
# every waiting run instead of letting a newer push cancel a pending one
# (docs.github.com "Workflow syntax for GitHub Actions", checked 2026-10-15).
concurrency:
  group: release-please
  cancel-in-progress: false
  queue: max

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # As in the release-please templates: when the RELEASE_PLEASE_CLIENT_ID
      # variable or RELEASE_PLEASE_APP_KEY secret is unset, or not available to
      # this run, warn and skip the steps below instead of failing at the token
      # step. The step gets only whether each one is set, because a secret
      # cannot be read in an `if:` (docs.github.com "Contexts reference",
      # context availability, checked 2026-10-17).
      - name: Check Release Please credentials
        id: credentials
        env:
          HAS_CLIENT_ID: ${{ vars.RELEASE_PLEASE_CLIENT_ID != '' }}
          HAS_APP_KEY: ${{ secrets.RELEASE_PLEASE_APP_KEY != '' }}
        run: |
          if [ "$HAS_CLIENT_ID" = true ] && [ "$HAS_APP_KEY" = true ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Release Please is not configured, or its credentials are not available to this run, so releases are skipped until the RELEASE_PLEASE_CLIENT_ID variable and the RELEASE_PLEASE_APP_KEY secret are both set."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Generate GitHub App token
        id: app-token
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_PLEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_KEY }}
          # Narrow the installation token to what release-please uses.
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        if: steps.credentials.outputs.configured == 'true'
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
