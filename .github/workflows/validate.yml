name: validate

# Validates this repository's own bootstrap.py and template validator — not
# to be confused with templates/ci.yml, templates/test*.yml, etc., which are
# rendered into *generated* repositories and run there instead.
on:
  pull_request:
  push:
    branches: [main]

# This workflow installs from requirements-dev.txt and runs validate_templates.py
# straight from the pull request's own tree — attacker-controlled code by design,
# as in any CI. That is safe only while the token stays read-only. Fork PRs get a
# read-only token automatically; declaring it makes the guarantee explicit and
# covers same-repo branch PRs too. A public repository runs fork PR
# workflows. On a public repository it configures, bootstrap.py sets the fork
# pull request approval policy so that an external contributor's run waits
# for a maintainer; the read-only token is what limits a run once approved.
permissions:
  contents: read

# Rapid pushes to a PR should not queue obsolete validation runs, as in the
# generated ci.yml and pr-title-check.yml. A push to main gets a group of its
# own, so neither a running nor a pending run on main is ever cancelled: each
# merge commit keeps its own result.
concurrency:
  group: validate-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  validate-templates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Full history and tags, so validate_templates.py can rebuild
        # LEGACY_TEMPLATE_DIGESTS from the release tags instead of skipping.
        # No token is left in .git/config for the PR's own code to read.
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install validator dependencies
        run: python -m pip install -r requirements-dev.txt
      - run: python -m py_compile bootstrap.py validate_templates.py
      - run: python validate_templates.py
      - run: python -m pytest
      # The generated repositories' baseline scripts ship with node:test suites;
      # run them here so a template regression fails this repository's CI, not
      # only a generated repository's.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: templates/.nvmrc
      - run: node --test templates/*.test.mjs
      # Generated Next.js repositories run Prettier with the template's
      # .prettierrc.json and ESLint with --max-warnings=0 over these scripts, so
      # an unformatted file or an unused variable here fails their CI. ESLint
      # runs only no-unused-vars: the repositories bring their own config.
      # 9.39.5 is the last ESLint 9 release, the line create-next-app 16.4.2
      # installs; ESLint 9 reached end of life on 2026-08-06, so npm marks
      # every 9.x release unsupported (eslint.org/version-support and
      # `npm view eslint`, read 2026-10-22).
      - name: Check generated script formatting and unused variables
        run: |
          npx --yes prettier@3.9.9 --config templates/.prettierrc.json --check "templates/*.mjs"
          npx --yes eslint@9.39.5 --no-config-lookup --rule '{"no-unused-vars":"error"}' "templates/*.mjs"
      # Generated AGENTS.md, CLAUDE.md, READMEs and docs land in repositories
      # that may lint Markdown; keep them markdownlint-clean.
      - name: Lint generated Markdown
        run: |
          python validate_templates.py --render-markdown "$RUNNER_TEMP/generated-markdown"
          npx --yes markdownlint-cli2@0.23.3 --config markdownlint-generated.jsonc "$RUNNER_TEMP/generated-markdown/**/*.md"
      # This repository's own docs, under the same rules. CHANGELOG.md is
      # written by Release Please, so it is left out.
      - name: Lint repository Markdown
        run: >-
          npx --yes markdownlint-cli2@0.23.3 --config markdownlint-generated.jsonc
          "*.md" "docs/**/*.md" ".github/**/*.md" ".agents/**/*.md" "!CHANGELOG.md"

  # bootstrap.py supports Python 3.11 and newer. The job above runs the full
  # suite on a current Python; this one keeps the oldest supported version
  # tested, so a newer-only feature cannot slip in unnoticed.
  python-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install validator dependencies
        run: python -m pip install -r requirements-dev.txt
      - run: python -m py_compile bootstrap.py validate_templates.py
      - run: python validate_templates.py
      - run: python -m pytest
