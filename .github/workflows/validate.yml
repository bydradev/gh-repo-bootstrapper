name: validate

# Validates this repository's own bootstrap.py and template validator — not
# to be confused with templates/ci.yml, templates/test*.yml, etc., which are
# rendered into *generated* repositories and run there instead.
on:
  pull_request:
  push:
    branches: [main]

# This workflow installs from requirements-dev.txt and runs validate_templates.py
# straight from the pull request's own tree — attacker-controlled code by design,
# as in any CI. That is safe only while the token stays read-only. Fork PRs get a
# read-only token automatically; declaring it makes the guarantee explicit and
# covers same-repo branch PRs too. bootstrap.py applies GitHub's fork-PR
# hardening API to private repos only, so once this repo is public that setting
# is not available to reapply here.
permissions:
  contents: read

# Rapid pushes to a PR should not queue obsolete validation runs. Matches the
# generated ci.yml and pr-title-check.yml templates, which both do this already.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Full history and tags, so validate_templates.py can rebuild
        # LEGACY_TEMPLATE_DIGESTS from the release tags instead of skipping.
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install validator dependencies
        run: python -m pip install -r requirements-dev.txt
      - run: python -m py_compile bootstrap.py validate_templates.py
      - run: python validate_templates.py
      - run: python -m pytest
      # The generated repositories' baseline scripts ship with node:test suites;
      # run them here so a template regression fails this repository's CI, not
      # only a generated repository's.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: templates/.nvmrc
      - run: node --test templates/*.test.mjs
      # Generated AGENTS.md, CLAUDE.md, READMEs and docs land in repositories
      # that may lint Markdown; keep them markdownlint-clean.
      - name: Lint generated Markdown
        run: |
          python validate_templates.py --render-markdown "$RUNNER_TEMP/generated-markdown"
          npx --yes markdownlint-cli2@0.23.3 --config markdownlint-generated.jsonc "$RUNNER_TEMP/generated-markdown/**/*.md"
