name: Baseline review

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  vulnerability-alerts: read

jobs:
  review:
    # ubuntu-slim: one CPU at a third of ubuntu-latest's per-minute price
    # (docs.github.com, "Actions runner pricing" and "GitHub-hosted runners
    # reference", read 2026-11-16); this weekly job installs from the lockfile
    # and reads the API, well inside slim's 15-minute job limit.
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run review:baselines
        env:
          GITHUB_TOKEN: ${{ github.token }}
