# NOT RENDERED BY bootstrap.py. This is a reference snippet, not a template.
#
# A new Python repository has no dependency manifest yet, and a `pip` entry
# makes Dependabot stop with "Repo must contain a requirements.txt, setup.py,
# setup.cfg, pyproject.toml, or a Pipfile." until one exists (dependabot-core
# python/lib/dependabot/python/file_fetcher.rb, checked 2026-10-21; GitHub's
# Dependabot options reference says the repository must contain a manifest or
# lock file for each package manager, checked 2026-10-21). `--type python`
# therefore renders dependabot-actions-only.yml instead.
#
# Once the repository has a pyproject.toml or a requirements file, copy the
# `pip` entry below into .github/dependabot.yml to opt in deliberately; the
# generated local-validation-python skill carries the same entry. Referenced
# from the `python` section of docs/repository-types.md.

version: 2
# Keep dependencies and workflow actions current; surface advisories.
updates:
  # Once the project commits a uv.lock, change this to `uv` so Dependabot
  # updates the lockfile as well as pyproject.toml.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    # Wait a week before proposing a new release, so a compromised or
    # broken version is usually caught and pulled first. Security updates
    # are not delayed.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    # Hold core tooling at their current major: a major bump needs deliberate
    # adoption, not an auto-merge.
    ignore:
      - dependency-name: ruff
        update-types: ["version-update:semver-major"]
      - dependency-name: mypy
        update-types: ["version-update:semver-major"]
      - dependency-name: pytest
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        patterns:
          - ruff
          - mypy
          - pytest
          - pytest-*

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
