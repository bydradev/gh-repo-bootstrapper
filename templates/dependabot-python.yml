version: 2
# Keep dependencies and workflow actions current; surface advisories.
updates:
  # Once the project commits a uv.lock, change this to `uv` so Dependabot
  # updates the lockfile as well as pyproject.toml.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    # Wait a week before proposing a new release, so a compromised or
    # broken version is usually caught and pulled first. Security updates
    # are not delayed.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    # Hold core tooling at their current major: a major bump needs deliberate
    # adoption, not an auto-merge.
    ignore:
      - dependency-name: ruff
        update-types: ["version-update:semver-major"]
      - dependency-name: mypy
        update-types: ["version-update:semver-major"]
      - dependency-name: pytest
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        patterns:
          - ruff
          - mypy
          - pytest
          - pytest-*

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
