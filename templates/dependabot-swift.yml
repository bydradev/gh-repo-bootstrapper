# NOT RENDERED BY bootstrap.py. This is a reference snippet, not a template.
#
# A new Swift repository has no usable SPM manifest yet, and Dependabot cannot
# read Swift package declarations out of an XcodeGen project.yml, so generating
# a `swift` ecosystem entry at bootstrap time would create a permanently failing
# updater. `--type swift` therefore renders dependabot-actions-only.yml instead.
#
# Once the repository has a root Package.swift (or another manifest Dependabot
# supports), copy this file over .github/dependabot.yml to opt in deliberately.
# Referenced from the `swift` section of docs/repository-types.md.

version: 2
# Keep dependencies and workflow actions current; surface advisories.
updates:
  - package-ecosystem: swift
    directory: "/"
    schedule:
      interval: weekly
    # Wait a week before proposing a new release, so a compromised or
    # broken version is usually caught and pulled first. Security updates
    # are not delayed.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    # Group all SPM packages: they tend to be few and intentional, so a
    # single batched PR is easier to review than one per package.
    groups:
      swift-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
