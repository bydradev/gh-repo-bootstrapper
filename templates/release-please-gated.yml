name: release-please

# Job order: test -> release-please
# A tag and GitHub Release are only ever created for a commit that passes
# tests: the guard step before release-please refuses to tag a release merge
# that an earlier run failed. release-please authenticates as a GitHub App
# (not GITHUB_TOKEN) so the release PR's commits and tags trigger other
# workflows normally.
#
# Requires: vars RELEASE_PLEASE_CLIENT_ID; secret RELEASE_PLEASE_APP_KEY.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  # `full` is true for a manual dispatch and for the commit that is the
  # Release Please PR merging (its title/commit message is the fixed
  # "chore(main): release X.Y.Z" pattern release-please always uses), and false
  # for every other push to main. The Swift suite runs only swift-format lint
  # when `full` is false and reserves xcodebuild test for full runs (pull
  # requests pass false too, so the Xcode lane runs only on a dispatch or the
  # release merge); the Python and Rust suites ignore `full` and run every check
  # on every push. Either way this job must pass before release-please runs, so
  # a failing suite blocks the release.
  test:
    uses: ./.github/workflows/test.yml
    with:
      full: "${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore(main): release') }}"

  release-please:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_PLEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_KEY }}
          # Narrow the installation token to what release-please uses.
          permission-contents: write
          permission-pull-requests: write

      # A release PR whose merge failed `test` keeps its "autorelease: pending"
      # label, and release-please would tag that untested merge on the next
      # passing push. Refuse unless the pending release merge is this commit,
      # and let release-please tag only on that commit's own run, so a release
      # PR merged while this run is in flight waits for its own tested run.
      - name: Refuse to tag an untested release merge
        id: guard
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          pending=$(gh pr list --repo "$REPO" --state merged --label "autorelease: pending" \
            --json number,mergeCommit --jq '.[] | "\(.number) \(.mergeCommit.oid)"')
          status=0
          while read -r number oid; do
            [ -n "$number" ] || continue
            if [ "$oid" != "$TESTED_SHA" ]; then
              echo "::error::Release PR #$number merged as $oid, which this run did not test ($TESTED_SHA). Re-run the workflow run for $oid if its failure was transient; otherwise remove the 'autorelease: pending' label from #$number to abandon that release, then fix forward."
              status=1
              continue
            fi
            release=true
          done <<< "$pending"
          echo "release=${release:-false}" >> "$GITHUB_OUTPUT"
          exit "$status"
        shell: bash

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          skip-github-release: ${{ steps.guard.outputs.release != 'true' }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
