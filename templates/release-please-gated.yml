name: release-please

# Job order: test -> release-please
# A tag and GitHub Release are only ever created for a commit that passes
# tests: the guard step before release-please refuses to tag a release merge
# that an earlier run failed. release-please authenticates as a GitHub App
# (not GITHUB_TOKEN) so the release PR's commits and tags trigger other
# workflows normally.
#
# Requires: vars RELEASE_PLEASE_CLIENT_ID; secret RELEASE_PLEASE_APP_KEY.
# Until both are set, each run still tests and then skips the release with a
# warning that names them.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Concurrency is set per job, not here: a newer push to main cancels the test
# job of an ordinary push, while the release job of every run waits its turn
# and is never cancelled. GitHub refuses queue: max together with
# cancel-in-progress: true in one block, so the two need separate groups.
# Source: docs.github.com "Workflow syntax for GitHub Actions"
# (concurrency, jobs.<job_id>.concurrency), checked 2026-11-02.

jobs:
  # `full` is true for a manual dispatch and for the commit that is the
  # Release Please PR merging (its title/commit message is the fixed
  # "chore(main): release X.Y.Z" pattern release-please always uses), and false
  # for every other push to main. The Swift suite runs only swift-format lint
  # when `full` is false and reserves xcodebuild test for full runs (pull
  # requests pass false too, so the Xcode lane runs only on a dispatch or the
  # release merge); the Android suite runs its fast checks when `full` is false
  # and `./gradlew check` when it is true; the Python and Rust suites ignore
  # `full` and run every check on every push. Either way this job must pass
  # before release-please runs, so a failing suite blocks the release.
  test:
    uses: ./.github/workflows/test.yml
    # An ordinary push to main joins one group, and the next ordinary push
    # cancels its test job, waiting or in progress; that run's release job
    # then does not run, and the run concludes cancelled. A re-run of an older
    # ordinary push joins the same group and cancels a newer push's tests. A
    # release merge and a manual dispatch each get a group of their own (the
    # run id), so no push cancels them: the release merge's own run tests it
    # and tags it. A release merge is recognised by its commit message, so
    # keep release-please's "chore(main): release" title when merging it. A
    # cancelled run is still billed for the minutes it used, and its commit
    # gets no test results, so deploy the newest commit on main. Concurrency
    # is one of the keys a job that calls a reusable workflow can set.
    # Source: docs.github.com "Workflow syntax for GitHub Actions"
    # (jobs.<job_id>.concurrency) and "Reusing workflow configurations"
    # (supported keywords for jobs that call a reusable workflow), checked
    # 2026-11-02.
    concurrency:
      group: "release-please-test-${{ (github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore(main): release')) && github.run_id || 'push' }}"
      cancel-in-progress: true
    with:
      full: "${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore(main): release') }}"

  release-please:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The release jobs of all runs go one at a time, roughly in the order they
    # start waiting (GitHub does not guarantee it), and queue: max keeps every
    # waiting one (up to 100) instead of the default, where a newer one
    # cancels the one still pending. Past 100 GitHub cancels new ones; re-run
    # a cancelled release merge's run. Test jobs of different runs overlap, so
    # a later push's release job can come before that of an earlier release
    # merge; the guard below then leaves the release to that merge's own run.
    # Source: docs.github.com "Workflow syntax for GitHub Actions"
    # (jobs.<job_id>.concurrency), checked 2026-11-02. actionlint 1.7.12 does
    # not know the queue key yet.
    concurrency:
      group: release-please
      cancel-in-progress: false
      queue: max
    # The guard step below lists pull requests, compares commits and lists
    # workflow runs with the workflow token, not the App token, so this job
    # reads all three. A job-level block replaces the workflow's, so
    # contents: read is repeated here. Source: docs.github.com "Workflow syntax
    # for GitHub Actions" (permissions); "Forming calls with GraphQL" (the data
    # read decides the permission; gh pr list --label searches through
    # GraphQL); and the REST reads of the same data, "List pull requests" (Pull
    # requests, read) and "Compare two commits" (Contents, read), checked
    # 2026-10-21; "List workflow runs for a workflow" (Actions, read, in
    # "Permissions required for GitHub Apps"), checked 2026-11-02.
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Releases need the Release Please App's RELEASE_PLEASE_CLIENT_ID variable
      # and RELEASE_PLEASE_APP_KEY secret. When either is unset, or not available
      # to this run, this step warns and the steps below are skipped, so the run
      # passes instead of failing at the token step; the test job still runs and
      # gates as before. A release PR merged meanwhile is not released, and the
      # guard below refuses it on later runs: once both are set, re-run that
      # merge's own workflow run, or remove its "autorelease: pending" label to
      # abandon it. A secret cannot be read in an `if:`, so the step gets only
      # whether each one is set (true or false), never the key itself; an unset
      # variable or secret reads as an empty string. Source: docs.github.com
      # "Contexts reference" (context availability, and "Available contexts" on
      # a property that does not exist) and "Evaluate expressions", checked
      # 2026-10-17.
      - name: Check Release Please credentials
        id: credentials
        env:
          HAS_CLIENT_ID: ${{ vars.RELEASE_PLEASE_CLIENT_ID != '' }}
          HAS_APP_KEY: ${{ secrets.RELEASE_PLEASE_APP_KEY != '' }}
        run: |
          if [ "$HAS_CLIENT_ID" = true ] && [ "$HAS_APP_KEY" = true ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Release Please is not configured, or its credentials are not available to this run, so releases are skipped until the RELEASE_PLEASE_CLIENT_ID variable and the RELEASE_PLEASE_APP_KEY secret are both set."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Generate GitHub App token
        id: app-token
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_PLEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_KEY }}
          # Narrow the installation token to what release-please uses.
          permission-contents: write
          permission-pull-requests: write

      # A release PR whose merge failed `test` keeps its "autorelease: pending"
      # label, and release-please would tag that untested merge on the next
      # passing push. Refuse when the pending release merge is older than this
      # commit and no run for it is still going, and let release-please tag only
      # on that merge's own run: a release PR merged after this commit, or
      # before it while its own run is still testing it, waits for that run.
      # This assumes one release PR at a time, which release-please keeps for
      # the single-package config generated here (it opens no release PR while a
      # merged one is pending). Never label a PR "autorelease: pending" by hand,
      # and rework this guard before moving to a multi-package config. The guard
      # only reads, so it runs with the workflow token (see this job's
      # permissions); the App token goes only to release-please.
      - name: Refuse to tag an untested release merge
        id: guard
        if: steps.credentials.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          pending=$(gh pr list --repo "$REPO" --state merged --label "autorelease: pending" \
            --json number,mergeCommit --jq '.[] | "\(.number) \(.mergeCommit.oid)"')
          status=0
          while read -r number oid; do
            [ -n "$number" ] || continue
            if [ "$oid" != "$TESTED_SHA" ]; then
              # A release merged after this commit has its own run, which tests
              # and releases it.
              order=$(gh api "repos/$REPO/compare/$TESTED_SHA...$oid" --jq .status </dev/null)
              if [ "$order" = "ahead" ]; then
                echo "::notice::Release PR #$number merged as $oid after $TESTED_SHA; that commit's own run releases it."
                other=true
                continue
              fi
              # Test jobs of different runs overlap, so this run can get here
              # while the run of an earlier release merge is still testing it.
              # That run then tests and releases its merge. Any run of this
              # workflow on that commit that has not completed counts.
              if [ "$order" = "behind" ]; then
                running=$(gh api "repos/$REPO/actions/workflows/release-please.yml/runs?head_sha=$oid" \
                  --jq '[.workflow_runs[] | select(.status != "completed")] | length' </dev/null)
                if [ "$running" -gt 0 ] 2>/dev/null; then
                  echo "::notice::Release PR #$number merged as $oid before $TESTED_SHA, and a run for $oid is still going; that run tests and releases it."
                  other=true
                  continue
                fi
              fi
              echo "::error::Release PR #$number merged as $oid, which this run did not test ($TESTED_SHA), and no run for $oid is still going. Re-run the run for $oid if its failure was transient; otherwise remove the 'autorelease: pending' label from #$number to abandon that release, then fix forward."
              status=1
              continue
            fi
            release=true
          done <<< "$pending"
          # release-please tags every pending merge at once, so it must not run
          # while another, untested one is pending too.
          if [ "${release:-false}" = true ] && [ -n "${other:-}" ]; then
            echo "::error::More than one release PR is pending, and release-please would tag them all, including a merge this run did not test. Leave 'autorelease: pending' on one of them and re-run that merge's own workflow run."
            release=false
            status=1
          fi
          echo "release=${release:-false}" >> "$GITHUB_OUTPUT"
          exit "$status"
        shell: bash

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        if: steps.credentials.outputs.configured == 'true'
        with:
          token: ${{ steps.app-token.outputs.token }}
          skip-github-release: ${{ steps.guard.outputs.release != 'true' }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
