name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml
    with:
      e2e: true
      full: "${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore(main): release') }}"

  release-please:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_PLEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_KEY }}
          # Narrow the installation token to what release-please uses.
          permission-contents: write
          permission-pull-requests: write

      # A release PR whose merge failed `test` keeps its "autorelease: pending"
      # label, and release-please would tag that untested merge on the next
      # passing push. Refuse when the pending release merge is older than this
      # commit, and let release-please tag only on that merge's own run, so a
      # release PR merged while this run is in flight waits for its own tested
      # run.
      - name: Refuse to tag an untested release merge
        id: guard
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          pending=$(gh pr list --repo "$REPO" --state merged --label "autorelease: pending" \
            --json number,mergeCommit --jq '.[] | "\(.number) \(.mergeCommit.oid)"')
          status=0
          while read -r number oid; do
            [ -n "$number" ] || continue
            if [ "$oid" != "$TESTED_SHA" ]; then
              # A release merged after this commit is still queued behind this
              # run; its own run tests and releases it.
              order=$(gh api "repos/$REPO/compare/$TESTED_SHA...$oid" --jq .status </dev/null)
              if [ "$order" = "ahead" ]; then
                echo "::notice::Release PR #$number merged as $oid after $TESTED_SHA; that commit's own run releases it."
                newer=true
                continue
              fi
              echo "::error::Release PR #$number merged as $oid, which this run did not test ($TESTED_SHA). Re-run the workflow run for $oid if its failure was transient; otherwise remove the 'autorelease: pending' label from #$number to abandon that release, then fix forward."
              status=1
              continue
            fi
            release=true
          done <<< "$pending"
          # release-please tags every pending merge at once, so it must not run
          # while a newer, untested one is pending too.
          if [ "${release:-false}" = true ] && [ -n "${newer:-}" ]; then
            echo "::error::More than one release PR is pending, and release-please would tag them all, including a merge this run did not test. Leave 'autorelease: pending' on one of them and re-run that merge's own workflow run."
            release=false
            status=1
          fi
          echo "release=${release:-false}" >> "$GITHUB_OUTPUT"
          exit "$status"
        shell: bash

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          skip-github-release: ${{ steps.guard.outputs.release != 'true' }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
