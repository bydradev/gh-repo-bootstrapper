name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Runs on main go one at a time, in order. queue: max keeps every waiting run
# (up to 100) instead of the default, where a newer push cancels the one still
# pending, so the run for a release merge always gets to test and tag it.
# Source: GitHub changelog 2026-05-07 and the concurrency docs, checked
# 2026-10-15. actionlint 1.7.12 does not know the key yet.
concurrency:
  group: release-please
  cancel-in-progress: false
  queue: max

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_PLEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_KEY }}
          # Narrow the installation token to what release-please uses.
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
