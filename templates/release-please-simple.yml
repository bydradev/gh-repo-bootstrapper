name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Runs on main go one at a time, roughly in the order they start waiting
# (GitHub does not guarantee it). queue: max keeps every waiting run (up to
# 100) instead of the default, where a newer push cancels the one still
# pending, so the run for a release merge gets to test and tag it. Past 100
# waiting runs GitHub cancels new ones; re-run a cancelled release merge's run.
# Source: docs.github.com "Workflow syntax for GitHub Actions", concurrency,
# checked 2026-10-15. actionlint 1.7.12 does not know the key yet.
concurrency:
  group: release-please
  cancel-in-progress: false
  queue: max

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Releases need the Release Please App's RELEASE_PLEASE_CLIENT_ID variable
      # and RELEASE_PLEASE_APP_KEY secret. When either is unset, or not available
      # to this run, this step warns and the steps below are skipped, so the run
      # passes instead of failing at the token step. A secret cannot be read in an
      # `if:`, so the step gets only whether each one is set (true or false),
      # never the key itself; an unset variable or secret reads as an empty
      # string. Source: docs.github.com "Using secrets in GitHub Actions",
      # "Contexts reference" (context availability) and "Evaluate expressions",
      # checked 2026-10-16.
      - name: Check Release Please credentials
        id: credentials
        env:
          HAS_CLIENT_ID: ${{ vars.RELEASE_PLEASE_CLIENT_ID != '' }}
          HAS_APP_KEY: ${{ secrets.RELEASE_PLEASE_APP_KEY != '' }}
        run: |
          if [ "$HAS_CLIENT_ID" = true ] && [ "$HAS_APP_KEY" = true ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Release Please is not configured, or its credentials are not available to this run, so releases are skipped until the RELEASE_PLEASE_CLIENT_ID variable and the RELEASE_PLEASE_APP_KEY secret are both set."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Generate GitHub App token
        id: app-token
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_PLEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_KEY }}
          # Narrow the installation token to what release-please uses.
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        if: steps.credentials.outputs.configured == 'true'
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
