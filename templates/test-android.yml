name: test

# Reusable Android test suite.
# Called by ci.yml on PRs and by release-please.yml on pushes to main.
on:
  workflow_call:
    inputs:
      full:
        description: >-
          Run full validation (./gradlew check) when true. false runs fast checks
          (./gradlew spotlessCheck lintDebug testDebugUnitTest). ci.yml passes false
          for pull requests, and release-please.yml passes false for ordinary pushes
          to main. release-please.yml passes true for a manual dispatch and for
          the commit that is the Release Please PR merging.
        type: boolean
        default: true

# The suite only needs to read the repository. Without this block the called
# workflow inherits the caller's permissions, and a called workflow can only
# ever narrow what it inherits, never widen it, so an explicit block here is
# the only way to guarantee build scripts and tests never run with more than
# read, regardless of what a caller grants itself now or in the future.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require an executable Gradle wrapper
        run: |
          if [ ! -f gradlew ]; then
            echo "::error::No Gradle wrapper found (gradlew missing). Add the application scaffold and wrapper before shipping."
            exit 1
          fi
          if [ ! -x gradlew ]; then
            echo "::error::Gradle wrapper gradlew is not executable."
            exit 1
          fi
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      # The fast checks run spotlessCheck, which exists only once the Spotless
      # Gradle plugin is applied. Gradle's own error for a missing task names no
      # fix, so look for the task first and say what to add. Any other Gradle
      # failure prints its output and fails here as it would in the checks.
      - name: Require the Spotless format check
        run: |
          if ! output=$(./gradlew --quiet help --task spotlessCheck 2>&1); then
            printf '%s\n' "$output"
            if printf '%s\n' "$output" | grep -q "Task 'spotlessCheck' not found"; then
              echo "::error::No spotlessCheck task found. Apply the Spotless Gradle plugin (com.diffplug.spotless) to the application's build, as README.md's Start here describes."
            else
              echo "::error::Gradle failed while looking for the spotlessCheck task; see its output above."
            fi
            exit 1
          fi
      - name: Run fast checks
        if: ${{ !inputs.full }}
        run: ./gradlew spotlessCheck lintDebug testDebugUnitTest
      - name: Run full validation
        if: ${{ inputs.full }}
        run: ./gradlew check
