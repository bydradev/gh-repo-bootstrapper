name: test

# Reusable Python test suite (lint, type check, unit tests).
# Called by ci.yml on PRs and by release-please.yml on pushes to main.
on:
  workflow_call:
    inputs:
      full:
        description: >-
          Accepted for caller-contract parity with the Swift test suite, which
          runs xcodebuild test only when `full` is true. This suite has no such
          lane — ruff, mypy and pytest all run in one ubuntu-latest job — so
          nothing is gated on it and every run is the full suite. Do not delete
          it as unused: release-please.yml passes `full`, and an undeclared
          input fails the workflow at parse time with "Invalid input, full is
          not defined in the referenced workflow".
        type: boolean
        default: true

# The suite only needs to read the repository. Without this block the called
# workflow inherits the caller's permissions, and a called workflow can only
# ever narrow what it inherits, never widen it — so an explicit block here is
# the only way to guarantee pip install and pytest never run with more than
# read, regardless of what a caller grants itself now or in the future.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            **/requirements*.txt
            pyproject.toml
            uv.lock
      - name: Install dependencies
        run: |
          # What pyproject.toml declares: `package` when pip should build and
          # install the project, `extra` and `group` for a `dev` extra or
          # dependency group. As uv does (docs.astral.sh, "Configuring
          # projects", checked 2026-10-15), a [project] with no [build-system]
          # is not built, and [tool.uv] package overrides that; a setup.py,
          # or a setup.cfg with setuptools metadata next to pyproject.toml,
          # also makes a package. pip needs a pyproject.toml or setup.py to
          # install a directory, so a lone setup.cfg is not one. `pyproject
          # deps` prints, one per line, the dependencies, dev extra and dev
          # group of a project that is not built. tomllib is in the standard
          # library from Python 3.11, guaranteed by the generated
          # .python-version pin.
          pyproject() {
            if [ ! -f pyproject.toml ]; then
              if [ -z "${1:-}" ] && [ -f setup.py ]; then echo package; fi
              return 0
            fi
            # -P keeps the repository off sys.path, so a project module
            # named like a standard one (platform.py, say) is not imported.
            python3 -P - "$@" <<'PY'
          import os, platform, re, sys, tomllib
          d = tomllib.load(open("pyproject.toml", "rb"))
          project = d.get("project", {})
          # Extra and group names compare normalized, as pip and uv do, so
          # `Dev` or `DEV` is the dev extra or group too.
          def norm(name):
              return re.sub(r"[-_.]+", "-", name).lower()
          extra = next((v for k, v in project.get("optional-dependencies", {}).items() if norm(k) == "dev"), None)
          package = d.get("tool", {}).get("uv", {}).get("package")
          if package is not None and not isinstance(package, bool):
              # uv refuses anything but true or false; "false" would be truthy.
              sys.exit(f"pyproject.toml: tool.uv.package must be true or false, not {package!r}")
          if package is None:
              # A setup.cfg counts only with setuptools' [metadata] or
              # [options] sections; one that only configures a tool such as
              # flake8 does not make a package.
              package = "build-system" in d or os.path.exists("setup.py") or (
                  os.path.exists("setup.cfg") and re.search(
                      r"(?m)^[ \t]*\[(metadata|options)(\.[^]]*)?\]", open("setup.cfg").read()) is not None)
          if sys.argv[1:] == ["deps"]:
              # Parsed with packaging, or the copy pip vendors, since this is
              # the interpreter pip installs into. Markers are evaluated here,
              # with the extra a requirement came from, so what is printed
              # has none. A dev extra may name the project itself, as in
              # "sample[test]"; that expands to those extras rather than
              # asking the package index for a project that is not built.
              try:
                  from packaging.requirements import InvalidRequirement, Requirement
                  from packaging.specifiers import SpecifierSet
                  from packaging.utils import canonicalize_name
              except ImportError:
                  from pip._vendor.packaging.requirements import InvalidRequirement, Requirement
                  from pip._vendor.packaging.specifiers import SpecifierSet
                  from pip._vendor.packaging.utils import canonicalize_name
              # pip enforces requires-python when it installs a package; do
              # the same here, since nothing is installed that would.
              supported = project.get("requires-python")
              if supported and not SpecifierSet(supported).contains(platform.python_version(), prereleases=True):
                  sys.exit(f"pyproject.toml: requires-python {supported!r} excludes Python {platform.python_version()}")
              own = canonicalize_name(project.get("name", ""))
              def normalized(table, what):
                  # Two names that normalize alike are an error, as in pip.
                  out = {}
                  for key, value in table.items():
                      if canonicalize_name(key) in out:
                          sys.exit(f"pyproject.toml: duplicate {what} name {key!r}")
                      out[canonicalize_name(key)] = value
                  return out
              extras = normalized(project.get("optional-dependencies", {}), "extra")
              # Both are arrays of strings; a string would be read letter by letter.
              for what, value in [("dependencies", project.get("dependencies", [])), *(
                      (f"optional-dependencies.{k}", v) for k, v in extras.items())]:
                  if not isinstance(value, list):
                      sys.exit(f"pyproject.toml: project.{what} is not a list")
                  # Every entry must be a dependency specifier, as a build
                  # would require, even in an extra that is not installed.
                  for item in value:
                      try:
                          Requirement(item if isinstance(item, str) else "")
                      except InvalidRequirement:
                          sys.exit(f"pyproject.toml: {item!r} in project.{what} is not a valid requirement")
              groups = normalized(d.get("dependency-groups", {}), "dependency group")
              def group(name, including=()):
                  # A PEP 735 group, with its {include-group = "..."} entries
                  # expanded, so a self-reference in it is resolved below
                  # rather than looked up on the package index by pip.
                  if name in including:
                      sys.exit(f"pyproject.toml: dependency group {name!r} includes itself")
                  if including and name not in groups:
                      sys.exit(f"pyproject.toml: dependency group {including[-1]!r} includes {name!r}, which is not defined")
                  if not isinstance(groups.get(name, []), list):
                      sys.exit(f"pyproject.toml: dependency group {name!r} is not a list")
                  if any(isinstance(item, dict) and set(item) != {"include-group"} for item in groups.get(name, [])):
                      sys.exit(f"pyproject.toml: dependency group {name!r} has a table that is not "
                               "exactly {include-group = \"...\"}")
                  return [r for item in groups.get(name, []) for r in (
                      group(canonicalize_name(item["include-group"]), (*including, name))
                      if isinstance(item, dict) else [item])]
              def resolve(requested):
                  # As pip reads the metadata a build writes: a project
                  # dependency is kept when its marker holds with "" (the
                  # base install) or with any requested extra, and an
                  # optional dependency's marker is evaluated with the extra
                  # it is listed under. A self-reference requests more extras.
                  printed, wanted = [], set(requested)
                  pending = [(r, None) for r in project.get("dependencies", [])]
                  pending += [(r, e) for e in sorted(requested) for r in extras.get(e, [])]
                  pending += [(r, "") for r in group("dev")]
                  seen = set(requested)
                  while pending:
                      text, source = pending.pop(0)
                      requirement = Requirement(text)
                      marker, requirement.marker = requirement.marker, None
                      scope = ["", *sorted(wanted)] if source is None else [source]
                      if marker and not any(marker.evaluate({"extra": e}) for e in scope):
                          continue
                      if canonicalize_name(requirement.name) != own:
                          printed.append(str(requirement))
                          continue
                      if requirement.url:
                          sys.exit(f"pyproject.toml: {str(requirement)!r} installs this project from a URL; "
                                   "add a [build-system] to install it as a package")
                      if not requirement.specifier.contains(project.get("version", "0"), prereleases=True):
                          sys.exit(f"pyproject.toml: {str(requirement)!r} excludes this project's own version")
                      for name in sorted(map(canonicalize_name, requirement.extras)):
                          wanted.add(name)
                          if name not in seen:
                              seen.add(name)
                              pending += [(r, name) for r in extras.get(name, [])]
                  return printed, wanted
              requested = {"dev"} if extra is not None else set()
              while True:
                  printed, wanted = resolve(requested)
                  if wanted == requested:
                      break
                  requested = wanted
              print(*printed, sep="\n") if printed else None
          else:
              print(*(word for word, ok in (("package", package), ("extra", extra is not None),
                                            ("group", "dev" in map(norm, d.get("dependency-groups", {})))) if ok))
          PY
          }
          if [ -f uv.lock ]; then
            # A uv project: install exactly what uv.lock records, as `uv sync`
            # does locally. --locked fails if uv.lock is out of date with
            # pyproject.toml. A declared `dev` group and `dev` extra are named
            # explicitly, since [tool.uv] default-groups can leave `dev` out.
            # Pinned (PyPI, 2026-10-08), like the tool fallbacks below.
            pip install uv==0.12.24
            tables=" $(pyproject) "
            dev=()
            case "$tables" in *" extra "*) dev+=(--extra dev) ;; esac
            case "$tables" in *" group "*) dev+=(--group dev) ;; esac
            uv sync --locked "${dev[@]}"
            echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
            export VIRTUAL_ENV="$PWD/.venv"
            install="uv pip install"
            show="uv pip show"
          else
            install="pip install"
            show="pip show"
            if [ -f requirements-dev.txt ]; then
              $install -r requirements-dev.txt
            elif [ -f requirements.txt ]; then
              $install -r requirements.txt
            elif [ -f pyproject.toml ] || [ -f setup.py ]; then
              # A PEP 621 `[project.optional-dependencies] dev` extra and a
              # PEP 735 `[dependency-groups] dev` group (what `uv add --dev`
              # writes) are both installed; pip reads groups from 25.1.
              # Tool-specific tables such as Poetry's
              # [tool.poetry.group.dev.dependencies] are not detected; add a
              # requirements-dev.txt to opt in to that dependency set instead.
              # The project itself is installed only when it is a package; a
              # scripts repository gets its declared dependencies instead, so
              # pip never tries to build what has nothing to build. A package
              # without a [build-system] (say a src/ layout relying on pip's
              # setuptools fallback) must declare one, as uv also requires.
              tables=" $(pyproject) "
              args=()
              case "$tables" in
                *" package "*)
                  case "$tables" in
                    *" extra "*) args+=(-e ".[dev]") ;;
                    *) args+=(-e .) ;;
                  esac
                  case "$tables" in
                    *" group "*)
                      $install --upgrade "pip>=25.1"
                      args+=(--group dev)
                      ;;
                  esac
                  ;;
                *)
                  # The dev extra and dev group are flattened in with the
                  # dependencies, so a reference to the project's own extras
                  # resolves locally.
                  deps=$(pyproject deps)
                  if [ -n "$deps" ]; then mapfile -t args <<< "$deps"; fi
                  ;;
              esac
              if [ "${#args[@]}" -gt 0 ]; then
                $install "${args[@]}"
              fi
            fi
          fi
          # Pinned fallbacks (PyPI, 2026-10-08), so the suite does not change
          # with each upstream release; a version the project already installed
          # from its own dependencies is kept.
          for tool in ruff==0.16.10 mypy==2.4.0 pytest==9.1.1; do
            $show "${tool%%==*}" > /dev/null 2>&1 || $install "$tool"
          done
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy .
      # python -m puts the repository root on sys.path, so tests import a
      # project that is not installed: one with no [build-system], which the
      # step above does not build and uv sync leaves out (pytest docs,
      # "Invoking pytest versus python -m pytest", checked 2026-10-15).
      - run: python -m pytest
