name: test

# Reusable Python test suite (lint, type check, unit tests).
# Called by ci.yml on PRs and by release-please.yml on pushes to main.
on:
  workflow_call:
    inputs:
      full:
        description: >-
          Accepted for caller-contract parity with the Swift test suite, which
          runs xcodebuild test only when `full` is true. This suite has no such
          lane — ruff, mypy and pytest all run in one ubuntu-latest job — so
          nothing is gated on it and every run is the full suite. Do not delete
          it as unused: release-please.yml passes `full`, and an undeclared
          input fails the workflow at parse time with "Invalid input, full is
          not defined in the referenced workflow".
        type: boolean
        default: true

# The suite only needs to read the repository. Without this block the called
# workflow inherits the caller's permissions, and a called workflow can only
# ever narrow what it inherits, never widen it — so an explicit block here is
# the only way to guarantee pip install and pytest never run with more than
# read, regardless of what a caller grants itself now or in the future.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            **/requirements*.txt
            pyproject.toml
            uv.lock
      - name: Install dependencies
        run: |
          # What pyproject.toml declares: `package` when pip should build and
          # install the project, `extra` and `group` for a `dev` extra or
          # dependency group. As uv does, a [project] with no [build-system]
          # is not built, and [tool.uv] package overrides that; a setup.py or
          # setup.cfg also makes a package. `pyproject deps` prints, one per
          # line, the dependencies and dev extra of a project that is not
          # built. tomllib is in the standard library from Python 3.11,
          # guaranteed by the generated .python-version pin.
          pyproject() {
            [ -f pyproject.toml ] || return 0
            python3 - "$@" <<'PY'
          import os, sys, tomllib
          d = tomllib.load(open("pyproject.toml", "rb"))
          project = d.get("project", {})
          extra = project.get("optional-dependencies", {}).get("dev")
          package = d.get("tool", {}).get("uv", {}).get("package")
          if package is None:
              package = "build-system" in d or any(map(os.path.exists, ("setup.py", "setup.cfg")))
          if sys.argv[1:] == ["deps"]:
              for requirement in project.get("dependencies", []) + (extra or []):
                  print(requirement)
          else:
              print(*(word for word, ok in (("package", package), ("extra", extra is not None),
                                            ("group", "dev" in d.get("dependency-groups", {}))) if ok))
          PY
          }
          if [ -f uv.lock ]; then
            # A uv project: install exactly what uv.lock records, as `uv sync`
            # does locally. --locked fails if uv.lock is out of date with
            # pyproject.toml. A declared `dev` group and `dev` extra are named
            # explicitly, since [tool.uv] default-groups can leave `dev` out.
            # Pinned (PyPI, 2026-10-08), like the tool fallbacks below.
            pip install uv==0.12.24
            tables=" $(pyproject) "
            dev=()
            case "$tables" in *" extra "*) dev+=(--extra dev) ;; esac
            case "$tables" in *" group "*) dev+=(--group dev) ;; esac
            uv sync --locked "${dev[@]}"
            echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
            export VIRTUAL_ENV="$PWD/.venv"
            install="uv pip install"
            show="uv pip show"
          else
            install="pip install"
            show="pip show"
            if [ -f requirements-dev.txt ]; then
              $install -r requirements-dev.txt
            elif [ -f requirements.txt ]; then
              $install -r requirements.txt
            elif [ -f pyproject.toml ]; then
              # A PEP 621 `[project.optional-dependencies] dev` extra and a
              # PEP 735 `[dependency-groups] dev` group (what `uv add --dev`
              # writes) are both installed; pip reads groups from 25.1.
              # Tool-specific tables such as Poetry's
              # [tool.poetry.group.dev.dependencies] are not detected; add a
              # requirements-dev.txt to opt in to that dependency set instead.
              # The project itself is installed only when it is a package; a
              # scripts repository gets its declared dependencies instead, so
              # pip never tries to build what has nothing to build.
              tables=" $(pyproject) "
              args=()
              case "$tables" in
                *" package "*)
                  case "$tables" in
                    *" extra "*) args+=(-e ".[dev]") ;;
                    *) args+=(-e .) ;;
                  esac
                  ;;
                *) mapfile -t args < <(pyproject deps) ;;
              esac
              case "$tables" in
                *" group "*)
                  $install --upgrade "pip>=25.1"
                  args+=(--group dev)
                  ;;
              esac
              if [ "${#args[@]}" -gt 0 ]; then
                $install "${args[@]}"
              fi
            fi
          fi
          # Pinned fallbacks (PyPI, 2026-10-08), so the suite does not change
          # with each upstream release; a version the project already installed
          # from its own dependencies is kept.
          for tool in ruff==0.16.10 mypy==2.4.0 pytest==9.1.1; do
            $show "${tool%%==*}" > /dev/null 2>&1 || $install "$tool"
          done
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy .
      - run: pytest
