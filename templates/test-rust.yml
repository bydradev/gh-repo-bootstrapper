name: test

# Reusable Rust test suite (format, lint, tests).
# Called by ci.yml on PRs and by release-please.yml on pushes to main.
on:
  workflow_call:
    inputs:
      full:
        description: >-
          Accepted for caller-contract parity with the Swift test suite, which
          runs xcodebuild test only when `full` is true. This suite has no such
          lane — fmt, clippy and cargo test all run in one ubuntu-latest job —
          so nothing is gated on it and every run is the full suite. Do not
          delete it as unused: release-please.yml passes `full`, and an
          undeclared input fails the workflow at parse time with "Invalid input,
          full is not defined in the referenced workflow".
        type: boolean
        default: true

# The suite only needs to read the repository. Without this block the called
# workflow inherits the caller's permissions, and a called workflow can only
# ever narrow what it inherits, never widen it — so an explicit block here is
# the only way to guarantee build scripts and tests never run with more than
# read, regardless of what a caller grants itself now or in the future.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require a Cargo manifest
        run: |
          if [ ! -f Cargo.toml ]; then
            echo "::error::No Cargo.toml at the repository root. Add the crate or workspace manifest."
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
