name: test

# Reusable test suite (lint, format check, typecheck, unit tests, production
# build, e2e). Called by ci.yml on PRs and by release-please.yml on pushes to
# main, where it gates the release tag. release-please.yml passes `e2e` and
# `full` as false for an ordinary push and true for the release merge and a
# manual dispatch.
on:
  workflow_call:
    inputs:
      full:
        description: >-
          Run the full suite including browser e2e. Used when merging a Release
          Please PR and for a manual dispatch of release-please.yml.
        type: boolean
        default: false
      e2e:
        description: >-
          Run browser e2e tests. When false, skips all e2e jobs unless `full`
          is set (pull requests and ordinary main pushes pass false for fast
          feedback). When true without `full`, runs chromium e2e only.
        type: boolean
        default: false

# The suite only needs to read the repository. The release job lives in
# release-please.yml and uses its own narrowed App token.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
# <<POSTGRES_BLOCK>>
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Fails closed if the production advisory baseline is malformed or if an
      # audit finding is not documented in docs/advisory-baseline.md.
      - run: npm run audit:production
      # Fails closed if lint-baseline rows and inline suppressions do not match.
      - run: npm run verify:baselines
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Browser e2e suite, kept as its own job so a browser flake never masks a
  # lint/typecheck regression. Skipped for PRs and ordinary main pushes (see
  # `e2e` above); runs on the Release Please PR merge and a manual dispatch of
  # release-please.yml.
  e2e:
    if: ${{ inputs.e2e || inputs.full }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The full run tests every configured project, so it needs every
      # default browser; a non-full E2E run tests Chromium only.
      - if: ${{ inputs.full }}
        run: npx playwright install --with-deps
      - if: ${{ !inputs.full }}
        run: npx playwright install --with-deps chromium
      - if: ${{ inputs.full }}
        run: npm run test:e2e
      - if: ${{ !inputs.full }}
        run: npm run test:e2e -- --project=chromium
      # playwright-report/ exists only if the scaffold's Playwright config
      # enables the HTML reporter in CI, e.g.
      # reporter: process.env.CI ? [["list"], ["html", { open: "never" }]] : "list"
      # With only the list reporter this step finds nothing and silently skips.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
